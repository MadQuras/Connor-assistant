<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- Main triangle -->
  <polygon points="32,8 56,52 8,52" fill="currentColor" opacity="0.95"/>

  <!-- Horizontal scan lines inside triangle (circuit detail) -->
  <line x1="20" y1="34" x2="44" y2="34" stroke="#05050E" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="23" y1="39" x2="41" y2="39" stroke="#05050E" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="26" y1="44" x2="38" y2="44" stroke="#05050E" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="17" y1="29" x2="47" y2="29" stroke="#05050E" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Center node dot -->
  <circle cx="32" cy="30" r="2.5" fill="#05050E" opacity="0.75"/>

  <!-- Glow effect (soft) -->
  <polygon points="32,8 56,52 8,52" fill="currentColor" opacity="0.08" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
